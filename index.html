<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nguyệt Hà | Cinematic Experience</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Force browser to preload cinematic fonts -->
    <div style="visibility: hidden; position: absolute; width: 0; height: 0; overflow: hidden;">
      <span style="font-family: 'Montserrat'; font-weight: 300;">Xin chào</span>
      <span style="font-family: 'Lora'; font-style: italic;">Nguyệt Hà</span>
    </div>

    <!-- Three.js Backend Canvas -->
    <div id="canvas-container"></div>
    
    <!-- UI Overlay -->
    <main id="app">
      <div id="ui-act1" class="ui-layer">
        <div class="star-container">
          <div class="breathing-star" id="trigger-star"></div>
          <p class="hint-text" id="hint-text">Đang thiết lập không gian...</p>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
